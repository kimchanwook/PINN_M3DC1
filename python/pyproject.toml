[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-m3dc1"
version = "0.1.0"
description = "Modular proof-of-concept PINN surrogate for M3D-C1-shaped resistive-MHD workflows"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.11",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "scipy>=1.14",
  "torch>=2.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

